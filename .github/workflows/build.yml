name: build-h7000-4.19

on:
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: 'msm-4.19 base commit (empty = branch head)'
        required: false
        default: ''
  push:
    branches: [ main, master ]

env:
  KERNEL_REPO: https://github.com/user-why-red/android_kernel_xiaomi_sdm660_419.git
  KERNEL_BRANCH: back
  TOOLCHAIN_BRANCH: lineage-19.1
  TOOLCHAIN_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: Checkout device overlay
        uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential python3 rsync \
            ca-certificates git cpio lz4 device-tree-compiler

      - name: Fetch aarch64 GCC 9.3 toolchain
        run: |
          git clone --depth 1 -b "$TOOLCHAIN_BRANCH" "$TOOLCHAIN_REPO" tc
          ./tc/bin/aarch64-linux-gnu-gcc --version | head -1

      - name: Fetch msm-4.19 base kernel
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" --single-branch "$KERNEL_REPO" kernel
          cd kernel
          if [ -n "${{ github.event.inputs.kernel_sha }}" ]; then
            git fetch --depth 1 origin "${{ github.event.inputs.kernel_sha }}" && \
              git checkout FETCH_HEAD || echo "pin unavailable, staying on branch head"
          fi
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: h7000-4.19-${{ env.KERNEL_BRANCH }}
          max-size: 2G

      - name: Configure kernel
        run: |
          export PATH="$PWD/tc/bin:$PATH"
          export USE_CCACHE=1
          bash scripts/build.sh apply
          bash scripts/build.sh config

      - name: Build kernel + dtbs
        run: |
          export PATH="$PWD/tc/bin:$PATH"
          export USE_CCACHE=1
          bash scripts/build.sh build

      - name: Package boot image
        run: |
          bash scripts/build.sh package

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7000-4.19-bootimg
          path: |
            artifacts/*
            build.log
          if-no-files-found: warn
          retention-days: 14
